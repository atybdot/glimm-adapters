name: Deploy web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Build examples
        run: pnpm build:examples

      - name: Stage examples into web app
        run: pnpm stage:examples

      - name: Build web app
        if: github.event_name != 'pull_request'
        run: pnpm --filter web build

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: pnpm exec cf deploy --prebuilt

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: apps/web
        # cf previews deploy runs its own build with preview intent. A normal
        # build cannot be reused here because the CLI rejects non-preview output.
        run: |
          set -o pipefail
          pnpm exec cf previews deploy "pr-${{ github.event.pull_request.number }}" 2>&1 | tee preview.log
          # The CLI prints the stable preview URL and a per-deployment URL,
          # both inside quotes. Match the host only so the comment stays a
          # clickable link.
          url=$(grep -m1 -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' preview.log || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview deployed: ${{ steps.preview.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body.startsWith("Preview deployed:"),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
